name: CI

on:
  push:
    branches: [ main, develop, ios-13 ]
    tags: [ '*-ios13.*' ]
  pull_request:
    branches: [ main, develop, ios-13 ]

jobs:
  test:
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # 16.4 is the image default, so its iOS 18.5 simulator runtime is the
        # one every runner VM carries. Keep this on 16.x: Xcode 26 and later
        # refuse deployment targets below iOS 15, so the iOS 13 build below
        # would stop checking anything.
        xcode-version: '16.4'
          
    - name: Build
      run: swift build

    # xcodebuild only offers the generic iOS Simulator destination when the
    # iOS platform matching the selected Xcode is installed, and some runner VMs
    # lack it (they carry runtimes for other Xcode versions only). Ask xcodebuild
    # itself, and install the matching platform when it has no such destination.
    - name: Ensure the selected Xcode has an iOS Simulator destination
      run: |
        xcrun simctl list runtimes
        if ! xcodebuild -showdestinations -scheme Tolgee 2>/dev/null | grep -q 'platform:iOS Simulator'; then
          echo "No iOS Simulator destination for this Xcode, downloading its iOS platform"
          xcodebuild -downloadPlatform iOS
          xcodebuild -showdestinations -scheme Tolgee | grep 'platform:iOS Simulator' | head -3
        fi

    # Compiles the sources against the package's iOS deployment target, so an
    # API that needs a newer iOS fails here instead of in a consuming app.
    # (tvOS and watchOS are not checked: the runner image has no simulator
    # runtimes for them, so xcodebuild cannot resolve those destinations.)
    - name: Build for iOS Simulator
      run: xcodebuild build -scheme Tolgee -destination 'generic/platform=iOS Simulator' -quiet

    - name: Run tests with coverage
      run: |
        swift test --no-parallel --enable-code-coverage

  # Swift Package Manager installs versions straight from git tags, so the tag
  # push itself is the release, even when the tests fail. Delete the tag if
  # this job does not run.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create GitHub pre-release
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
