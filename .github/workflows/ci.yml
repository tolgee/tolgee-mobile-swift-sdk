name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One toolchain failing should not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          # The oldest toolchain the package is checked with. 16.4 is the
          # macos-15 image default, so its iOS 18.5 simulator runtime is the one
          # every runner VM carries. Its SwiftPM also lower-cases `.lproj` folder
          # names in resource bundles, which newer releases keep as written, so
          # the two jobs together cover both namings.
          - name: Xcode 16.4
            os: macos-15
            xcode: '16.4'
          # Whatever stable Xcode the newest runner image ships. Not pinned, so
          # the suite is checked against new toolchains as they arrive.
          - name: latest Xcode
            os: macos-latest
            xcode: latest-stable

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Show toolchain
      run: |
        sw_vers
        xcodebuild -version
        swift --version

    - name: Build
      run: swift build

    # xcodebuild only offers the generic iOS Simulator destination when the
    # iOS platform matching the selected Xcode is installed, and some runner VMs
    # lack it (they carry runtimes for other Xcode versions only). Ask xcodebuild
    # itself, and install the matching platform when it has no such destination.
    - name: Ensure the selected Xcode has an iOS Simulator destination
      run: |
        xcrun simctl list runtimes
        if ! xcodebuild -showdestinations -scheme Tolgee 2>/dev/null | grep -q 'platform:iOS Simulator'; then
          echo "No iOS Simulator destination for this Xcode, downloading its iOS platform"
          xcodebuild -downloadPlatform iOS
          xcodebuild -showdestinations -scheme Tolgee | grep 'platform:iOS Simulator' | head -3
        fi

    # Compiles the sources against the package's iOS deployment target, so an
    # API that needs a newer iOS fails here instead of in a consuming app.
    # (tvOS and watchOS are not checked: the runner image has no simulator
    # runtimes for them, so xcodebuild cannot resolve those destinations.)
    - name: Build for iOS Simulator
      run: xcodebuild build -scheme Tolgee -destination 'generic/platform=iOS Simulator' -quiet

    - name: Run tests with coverage
      run: |
        swift test --no-parallel --enable-code-coverage
